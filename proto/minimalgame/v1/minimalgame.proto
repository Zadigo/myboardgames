syntax = "proto3";

package minimalgame.v1;

service TableService {
    rpc CreateTable (CreateTableRequest) returns (TableResponse);
    rpc GetTable (GetTableRequest) returns (TableResponse);
    rpc JoinTable (JoinTableRequest) returns (TableResponse);
    rpc LeaveTable (LeaveTableRequest) returns (TableResponse);
    rpc StartGame (StartGameRequest) returns (TableResponse);
    rpc EndGame (EndGameRequest) returns (TableResponse);
    rpc DistributeCards (DistributeCardsRequest) returns (TableResponse);
    rpc NextRound (NextRoundRequest) returns (TableResponse);
    rpc NextTurn (NextTurnRequest) returns (TableResponse);
    rpc ShuffleCards (ShuffleCardsRequest) returns (TableResponse);
    rpc BanPlayer (BanPlayerRequest) returns (TableResponse);
    rpc ExchangeCardsWithPlayer (ExchangeCardsWithPlayerRequest) returns (TableResponse);
    rpc ExchangeCardsWithDeck (ExchangeCardsWithDeckRequest) returns (TableResponse);
    rpc ExecuteInstruction (ExecuteInstructionRequest) returns (TableResponse);
    rpc Reset (ResetRequest) returns (TableResponse);
    rpc Ping (PingRequest) returns (TableResponse);
}

message CreateTableRequest {
    string client_id = 1; // The player creating the table
}

message GetTableRequest {
    string id = 1; // The id of the table to get
}

message JoinTableRequest {
    string client_id = 1; // The player joining the table
    string table_id = 2;
}

message LeaveTableRequest {
    string client_id = 1;
    string table_id = 2;
}

message StartGameRequest {
    string table_id = 1;
}

message EndGameRequest {
    string table_id = 1;
}

message DistributeCardsRequest {
    string table_id = 1;
}

message NextTurnRequest {
    string table_id = 1;
    bool reverse = 2;
}

message NextRoundRequest {
    string table_id = 1;
}

message ShuffleCardsRequest {
    string table_id = 1;
    repeated Card cards = 2;
}

message ResetRequest {
    string table_id = 1;
}

/**
 * Check if the table is alive
 */
message PingRequest {
    string table_id = 1;
}

message BanPlayerRequest {
    string client_id = 1;
    string table_id = 2;
}

message ExchangeCardsWithPlayerRequest {
    string table_id = 1;
    string from = 2; // The player giving cards
    string to = 3; // The player receiving cards
    repeated string cards = 4;
}

message ExchangeCardsWithDeckRequest {
    string table_id = 1;
    repeated string cards = 2;
}

/**
 * Executes a none-conventional or specific game
 * related instruction that the game developper
 * must implement for custom/tailored game logic
 */
message ExecuteInstructionRequest {
    string table_id = 1; // The table to which the move will apply
    string action_name = 2; // The name of the instruction/action to apply (will trigger game logic)
    repeated string from = 3; // The player(s) making the move
    repeated string to = 4; // If applicable, the target player(s) that will by affected by the move
    repeated string card_ids = 5; // Card or cards used to make the move (should be a single ID or a groupe IDs)
}

message Card {
    string id = 1;
}

enum EventName {
    EVENT_NAME_UNSPECIFIED = 0;
    EVENT_NAME_CREATED = 1;
    EVENT_NAME_IDLE = 2;
    EVENT_NAME_WAITING = 3;
    EVENT_NAME_UPDATED = 4;
    EVENT_NAME_DELETED = 5;
    EVENT_NAME_ADD_PLAYER = 6;
    EVENT_NAME_REMOVE_PLAYER = 7;
    EVENT_NAME_BAN_PLAYER = 8;
	EVENT_NAME_CREATE_DECK = 9;
	EVENT_NAME_SHUFFLE_DECK = 10;
	EVENT_NAME_DISTRIBUTE_CARDS = 11;
	EVENT_NAME_EXCHANGE_CARDS_WITH_PLAYER = 12;
	EVENT_NAME_EXCHANGE_CARDS_WITH_DECK = 13;
	EVENT_NAME_NEXT_TURN = 14;
	EVENT_NAME_REVERSE_TURN = 15;
}

message TableEventDetails {
    EventName event_name = 1;
    repeated string from = 2;
    repeated string to = 3;
    Card card = 4;
}

message TableSnapshot {
    repeated Card deck = 1;
}

message TableEvent {
    string id = 1;
    string table_id = 2; 
    TableEventDetails details = 3;
    TableSnapshot snapshot = 4;
}

message TableResponse {
    string id = 1; // A unique id for the response which is generally a uuid string
    int32 current_round = 2;
    string current_player = 3; // The id of the current player
    optional TableEvent event = 4; // The event that occurred (if applicable)
    string updated_at = 5;
    string created_at = 6;
}
